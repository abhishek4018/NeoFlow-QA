services:
  neoflow-care-daemon:
    build: .
    container_name: neoflow-care-daemon
    restart: unless-stopped
    init: true
    shm_size: '1gb'
    environment:
      - TARGET_URL=https://quickexamcreator.com
      - NODE_ENV=production
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=llama3.2:3b
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./target:/app/target
      - ./storage:/app/storage
      - ./src:/app/src
      - ./support:/app/support
      - ./codegen:/app/codegen
      - ./features/codegen:/app/features/codegen
      - ./step-definitions/codegen:/app/step-definitions/codegen
    ports:
      - "8080:8080"
