name: Build & Push E2E Runner Docker Image

on:
  push:
    branches: [ "pariksha", "main" ]
  workflow_dispatch:

jobs:
  build-and-push-e2e-image:
    name: Build & Push E2E Container Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout E2E Test Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GCP Artifact Registry
        if: github.ref == 'refs/heads/pariksha' || github.ref == 'refs/heads/main'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Log in to Google Artifact Registry
        if: github.ref == 'refs/heads/pariksha' || github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: asia-south1-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.e2e
          push: ${{ github.ref == 'refs/heads/pariksha' || github.ref == 'refs/heads/main' }}
          tags: |
            asia-south1-docker.pkg.dev/pariksha-503911/pariksha/pariksha-e2e-runner:uat
            asia-south1-docker.pkg.dev/pariksha-503911/pariksha/pariksha-e2e-runner:latest
