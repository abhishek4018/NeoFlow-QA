name: NeoFlow-QA BDD Test Suite Execution

on:
  push:
    branches: [ "pariksha", "main" ]
  workflow_dispatch:

jobs:
  run-e2e-smoke-tests:
    name: Run E2E Smoke Tests on UAT
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js (v24)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies & Playwright Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Execute Serenity BDD Smoke Suite against UAT
        env:
          ENVIRONMENT: uat
          BASE_URL: https://uat.quickexamcreator.com
          HEADLESS: "true"
        run: |
          npm run test:smoke

      - name: Upload Serenity HTML Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serenity-e2e-report-neoflow
          path: target/site/serenity
          retention-days: 14
