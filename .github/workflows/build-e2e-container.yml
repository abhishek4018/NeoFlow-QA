name: Test Suite Syntax Verification

on:
  push:
    branches: [ "pariksha", "main" ]
  pull_request:
    branches: [ "pariksha", "main" ]
  workflow_dispatch:

jobs:
  validate-test-suite:
    name: Validate BDD Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci

      - name: Verify Feature & Step Definition Syntax
        run: |
          npx cucumber-js --dry-run
